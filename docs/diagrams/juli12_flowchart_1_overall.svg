<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 700" style="width:100%; max-width:910px; height:auto; display:block; margin:8px auto; background:#ffffff; border:1px solid #cbd5e1; border-radius:8px;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="910" height="34" rx="8" ry="8" fill="#1e3a8a"/>
  <text x="455.0" y="22" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">圖 1：系統整體運行與角色會話路由流程圖 (Overall System Flowchart)</text>
  <rect x="310" y="48" width="280" height="40" rx="20" ry="20" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="450.0" y="61.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">程序啟動 main()</text>
<text x="450.0" y="78.0" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#0f172a">初始化 ParkingService 與 Storage</text>
<path d="M 450,88 L 450,110" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="260" y="110" width="380" height="44" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="450.0" y="125.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">調用 storage.Load(service)</text>
<text x="450.0" y="142.0" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#0f172a">輸出 loaded.message (First run / Loaded / Recovered)</text>
<path d="M 450,154 L 450,178" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<polygon points="450,179.0 550.0,208 450,237.0 350.0,208" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="450" y="209.75" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#78350f">loaded.ok 為真?</text>
<path d="M 550,208 L 645,208" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="555" y="198" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">否 (載入失敗)</text>
<rect x="645" y="182" width="240" height="52" rx="8" ry="8" fill="#fee2e2" stroke="#991b1b" stroke-width="1.8"/>
<text x="765.0" y="201.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">直接返回退出碼 1</text>
<text x="765.0" y="218.0" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#0f172a">保留原文件與 .bak，拒絕啟動</text>
<path d="M 450,237 L 450,262" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="458" y="253" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">是</text>
<rect x="240" y="262" width="420" height="44" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="450.0" y="277.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">輸出收費規則橫幅 (20 MOP/h, 400 MOP/24h cap)</text>
<text x="450.0" y="294.0" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#0f172a">進入頂層角色菜單: 1 = ordinary, 2 = administrator, 0 = exit</text>
<path d="M 450,306 L 450,330" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<polygon points="450,330.0 565.0,362 450,394.0 335.0,362" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="450" y="363.75" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#78350f">讀取頂層選擇 choice</text>
<path d="M 335,362 L 165,362 L 165,415" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="180" y="353" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">choice == 1 (普通用戶)</text>
<rect x="28" y="415" width="275" height="50" rx="8" ry="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
<text x="165.5" y="433.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">普通用戶會話 RunOrdinaryUserSession()</text>
<text x="165.5" y="450.0" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#0f172a">1=list, 2=find, 3=count, 0=logout</text>
<path d="M 165,465 L 165,490" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="28" y="490" width="275" height="68" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="165.5" y="501.8" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="normal" fill="#0f172a">• 1/2/3: RunReadChoice() 查詢車輛/費用/總數</text>
<text x="165.5" y="517.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="normal" fill="#0f172a">• 其他輸入 (如 4/5/6): 輸出 Invalid choice.</text>
<text x="165.5" y="533.2" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="normal" fill="#0f172a">• 0 (logout): 返回頂層角色選擇菜單</text>
<text x="165.5" y="548.9" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="normal" fill="#0f172a">• EOF: 安全結束會話並進入退出保存</text>
<path d="M 28,524 L 12,524 L 12,284 L 240,284" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="18" y="395" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">0 = logout</text>
<path d="M 565,362 L 735,362 L 735,415" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="585" y="353" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">choice == 2 (管理員)</text>
<rect x="585" y="415" width="302" height="50" rx="8" ry="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="736.0" y="433.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">管理員會話 RunAdminUserSession()</text>
<text x="736.0" y="450.0" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#0f172a">1..3=查詢, 4=add, 5=modify, 6=delete, 0=logout</text>
<path d="M 735,465 L 735,490" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="585" y="490" width="302" height="68" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="736.0" y="501.8" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="normal" fill="#0f172a">• 1/2/3: RunReadChoice() 共享查詢與統計</text>
<text x="736.0" y="517.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="normal" fill="#0f172a">• 4/5/6: 執行增/改/刪並立即 storage.Save()</text>
<text x="736.0" y="533.2" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="normal" fill="#0f172a">• 0 (logout): 返回頂層角色選擇菜單</text>
<text x="736.0" y="548.9" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="normal" fill="#0f172a">• 其他輸入: 輸出 Invalid choice. | EOF: 結束會話</text>
<path d="M 887,524 L 898,524 L 898,284 L 660,284" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="828" y="395" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">0 = logout</text>
<path d="M 450,394 L 450,582" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="340" y="445" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">choice == 0 或 EOF</text>
<rect x="265" y="582" width="370" height="44" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="450.0" y="597.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">退出前調用 storage.Save(service)</text>
<text x="450.0" y="614.0" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#0f172a">輸出 saved.message (Parking data saved. 或錯誤)</text>
<path d="M 450,626 L 450,648" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="290" y="648" width="320" height="38" rx="18" ry="18" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="450.0" y="668.75" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">saved.ok ? 返回退出碼 0 : 返回退出碼 1</text>
</svg>