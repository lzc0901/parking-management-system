<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 742" style="width:100%; max-width:910px; height:auto; display:block; margin:8px auto; background:#ffffff; border:1px solid #cbd5e1; border-radius:8px;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="910" height="34" rx="8" ry="8" fill="#1e3a8a"/>
  <text x="455.0" y="22" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">圖 2：管理員增刪改（CRUD）與即時持久化流程圖 (CRUD &amp; Persistence Flowchart)</text>
  <rect x="280" y="46" width="350" height="40" rx="18" ry="18" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="455.0" y="67.75" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">管理員輸入 4 = add / 5 = modify / 6 = delete</text>
<path d="M 455,86 L 455,108" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="215" y="108" width="480" height="48" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="455.0" y="125.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">讀取控制台輸入參數 (EOF 則立即中止返回 false):</text>
<text x="455.0" y="142.0" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#0f172a">• 若 5 或 6: 讀取 Existing plate  |  • 若 4 或 5: 調用 ReadRecord() 讀取四項字段</text>
<path d="M 455,156 L 455,178" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="235" y="178" width="440" height="42" rx="8" ry="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
<text x="455.0" y="192.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">ParkingService 入口權限檢查: role == Role::kAdmin ?</text>
<text x="455.0" y="209.0" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#0f172a">(非 Admin 立即返回 VehicleResult::kForbidden -&gt; Permission denied.)</text>
<path d="M 455,220 L 455,242" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<polygon points="455,243.0 565.0,272 455,301.0 345.0,272" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="455" y="273.75" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#78350f">操作類型為 6 (delete) ?</text>
<path d="M 345,272 L 170,272 L 170,322" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="210" y="264" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">是 (6 = delete)</text>
<rect x="25" y="322" width="290" height="52" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="170.0" y="341.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">DeleteVehicle(Role::kAdmin, plate)</text>
<text x="170.0" y="357.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="normal" fill="#0f172a">校驗車牌非空/無空格，在 std::map 查找並移除</text>
<path d="M 455,301 L 455,322" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="463" y="315" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">否 (4 = add / 5 = modify)</text>
<rect x="330" y="322" width="555" height="68" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="607.5" y="333.7" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.3" font-weight="bold" fill="#0f172a">調用 Validated(record, reference) 執行三層輸入校驗:</text>
<text x="607.5" y="349.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.3" font-weight="normal" fill="#0f172a">1. NormalizeField(): 禁控制字符 (&lt;0x20, 0x7F)、去首尾空格、禁空值、禁車牌內部空格</text>
<text x="607.5" y="365.3" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.3" font-weight="normal" fill="#0f172a">2. ParseTimestamp(): 校驗 16 位 YYYY-MM-DD HH:MM 語法、公曆閏年天數與 mktime 往返</text>
<text x="607.5" y="381.1" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.3" font-weight="normal" fill="#0f172a">3. NormalizeToMinute(): 參考時間對齊至整分鐘，若 entry &gt; reference 返回 kFutureTime</text>
<path d="M 607,390 L 607,412" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330" y="412" width="555" height="52" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="607.5" y="423.6" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.3" font-weight="bold" fill="#0f172a">檢查 std::map&lt;string, VehicleRecord&gt; 存在性與車牌唯一性:</text>
<text x="607.5" y="439.40000000000003" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.3" font-weight="normal" fill="#0f172a">• add: 車牌已存在 -&gt; kDuplicatePlate</text>
<text x="607.5" y="455.20000000000005" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.3" font-weight="normal" fill="#0f172a">• modify: 原車牌不存在 -&gt; kNotFound; 新車牌與他車衝突 -&gt; kDuplicatePlate</text>
<path d="M 170,374 L 170,505 L 345,505" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 607,464 L 607,505 L 565,505" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<polygon points="455,476.0 565.0,505 455,534.0 345.0,505" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="455" y="506.75" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#78350f">業務執行結果 == kOk ?</text>
<path d="M 345,518 L 180,555" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="190" y="535" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">否 (校驗或查找失敗)</text>
<rect x="25" y="555" width="315" height="68" rx="8" ry="8" fill="#fee2e2" stroke="#991b1b" stroke-width="1.8"/>
<text x="182.5" y="566.8000000000001" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="bold" fill="#0f172a">原內存數據保持不變，輸出精確英文提示:</text>
<text x="182.5" y="582.5000000000001" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="normal" fill="#0f172a">Invalid required field. / Invalid entry time. /</text>
<text x="182.5" y="598.2" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="normal" fill="#0f172a">Entry time is in the future. / Plate already exists. /</text>
<text x="182.5" y="613.9000000000001" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="normal" fill="#0f172a">Vehicle not found.</text>
<path d="M 565,518 L 665,555" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="585" y="535" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">是 (內存已更新)</text>
<rect x="495" y="555" width="375" height="44" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="682.5" y="578.75" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">立即調用 storage.Save(service) 同步持久化至磁盤</text>
<path d="M 682,599 L 682,622" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<polygon points="682,622.0 777.0,648 682,674.0 587.0,648" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="682" y="649.75" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#78350f">saved.ok 為真?</text>
<path d="M 587,648 L 470,648" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="535" y="640" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">是</text>
<rect x="205" y="626" width="265" height="44" rx="8" ry="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="337.5" y="641.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">輸出成功提示:</text>
<text x="337.5" y="657.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="normal" fill="#0f172a">Updated and saved. Parking data saved.</text>
<path d="M 777,648 L 777,685" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="785" y="668" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">否 (保存失敗)</text>
<rect x="495" y="685" width="390" height="44" rx="8" ry="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.8"/>
<text x="690.0" y="700.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">輸出僅內存更新警告:</text>
<text x="690.0" y="716.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="normal" fill="#0f172a">Updated in memory, but save failed: &lt;reason&gt;</text>
</svg>