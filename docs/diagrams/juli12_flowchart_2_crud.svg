<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 610" width="840" height="610" role="img" aria-label="图 2：管理员新增、修改与删除流程">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="610" fill="#ffffff"/>
  <rect x="260.0" y="14.0" width="260.0" height="44.0" rx="22.0" ry="22.0" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.8"/>
  <text x="390.0" y="31.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="600" fill="#1e3a8a">管理员选择写入操作</text>
  <text x="390.0" y="49.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#1e3a8a">(4 新增 / 5 修改 / 6 删除)</text>
  <rect x="218.0" y="88.0" width="344.0" height="68.0" rx="7" ry="7" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="390.0" y="108.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">依操作读取所需输入数据</text>
  <text x="390.0" y="126.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">新增：车牌、品类、颜色、入场时间</text>
  <text x="390.0" y="144.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">修改：先输原车牌，再输新四项｜删除：只输原车牌</text>
  <polygon points="390.0,194.0 528.0,232.0 390.0,270.0 252.0,232.0" fill="#fef9c3" stroke="#b45309" stroke-width="1.7"/>
  <text x="390.0" y="227.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="600" fill="#78350f">字段、时间格式与</text>
  <text x="390.0" y="245.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#78350f">车牌条件是否通过？</text>
  <path d="M 390.0 58.0 L 390.0 88.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 390.0 156.0 L 390.0 194.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="598.0" y="199.0" width="216.0" height="66.0" rx="7" ry="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="706.0" y="218.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="600" fill="#7f1d1d">显示对应错误信息</text>
  <text x="706.0" y="236.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#7f1d1d">（字段/时间/找不到/重复）</text>
  <text x="706.0" y="254.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#7f1d1d">原有车辆记录保持不变</text>
  <path d="M 528.0 232.0 L 598.0 232.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="548.0" y="210.0" width="28.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="562.0" y="223.0" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="11.5" font-weight="600" fill="#334155">否</text>
  <rect x="122.0" y="311.0" width="236.0" height="46.0" rx="7" ry="7" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="240.0" y="338.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">更新内存中的车辆记录</text>
  <path d="M 390.0 270.0 L 390.0 294.0 L 240.0 294.0 L 240.0 311.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="301.0" y="273.0" width="28.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="315.0" y="286.0" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="11.5" font-weight="600" fill="#334155">是</text>
  <rect x="122.0" y="388.0" width="236.0" height="44.0" rx="7" ry="7" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="240.0" y="414.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">尝试立即保存至本机文件</text>
  <path d="M 240.0 357.0 L 240.0 388.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polygon points="240.0,459.0 340.0,490.0 240.0,521.0 140.0,490.0" fill="#fef9c3" stroke="#b45309" stroke-width="1.7"/>
  <text x="240.0" y="494.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="600" fill="#78350f">文件保存成功？</text>
  <path d="M 240.0 432.0 L 240.0 459.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="24.0" y="538.0" width="184.0" height="40.0" rx="7" ry="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="116.0" y="562.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="600" fill="#14532d">显示「已更新并保存」</text>
  <path d="M 140.0 490.0 L 116.0 490.0 L 116.0 538.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="108.0" y="469.0" width="28.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="122.0" y="482.0" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="11.5" font-weight="600" fill="#334155">是</text>
  <rect x="295.0" y="538.0" width="254.0" height="40.0" rx="7" ry="7" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/>
  <text x="422.0" y="562.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="600" fill="#7c2d12">警告「仅内存更新，保存失败」</text>
  <path d="M 340.0 490.0 L 422.0 490.0 L 422.0 538.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="368.0" y="469.0" width="28.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="382.0" y="482.0" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="11.5" font-weight="600" fill="#334155">否</text>
  <rect x="619.0" y="537.0" width="174.0" height="42.0" rx="21.0" ry="21.0" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.8"/>
  <text x="706.0" y="562.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="600" fill="#1e3a8a">返回管理员菜单</text>
  <path d="M 706.0 265.0 L 706.0 537.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 549.0 558.0 L 619.0 558.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 116.0 578.0 L 116.0 598.0 L 706.0 598.0 L 706.0 579.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
