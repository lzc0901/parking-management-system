<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 526" width="780" height="526" role="img" aria-label="图 3：停车时长与费用计算流程">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="526" fill="#ffffff"/>
  <rect x="268.0" y="13.0" width="224.0" height="38.0" rx="19.0" ry="19.0" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.8"/>
  <text x="380.0" y="36.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="600" fill="#1e3a8a">开始计算停车时长与费用</text>
  <rect x="235.0" y="72.0" width="290.0" height="48.0" rx="7" ry="7" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="380.0" y="91.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">取得入场时间与查询基准时间</text>
  <text x="380.0" y="109.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">并将两者对齐至本地整分钟</text>
  <polygon points="380.0,146.0 515.0,182.0 380.0,218.0 245.0,182.0" fill="#fef9c3" stroke="#b45309" stroke-width="1.7"/>
  <text x="380.0" y="177.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="600" fill="#78350f">时间合法且基准时间</text>
  <text x="380.0" y="195.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#78350f">不早于入场时间？</text>
  <path d="M 380.0 51.0 L 380.0 72.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 380.0 120.0 L 380.0 146.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="550.0" y="159.0" width="200.0" height="46.0" rx="23.0" ry="23.0" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="650.0" y="177.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="600" fill="#7f1d1d">返回计算失败</text>
  <text x="650.0" y="195.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#7f1d1d">不输出无效费用</text>
  <path d="M 515.0 182.0 L 550.0 182.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="518.0" y="160.0" width="28.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="532.0" y="173.0" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="11.5" font-weight="600" fill="#334155">否</text>
  <rect x="145.0" y="247.0" width="210.0" height="42.0" rx="7" ry="7" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="250.0" y="272.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">计算总停留分钟数</text>
  <path d="M 380.0 218.0 L 380.0 236.0 L 250.0 236.0 L 250.0 247.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="302.0" y="217.0" width="28.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="316.0" y="230.0" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="11.5" font-weight="600" fill="#334155">是</text>
  <rect x="115.0" y="317.0" width="270.0" height="46.0" rx="7" ry="7" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="250.0" y="335.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">拆分为完整 24 小时天数</text>
  <text x="250.0" y="353.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">与不满 24 小时的剩余分钟数</text>
  <path d="M 250.0 289.0 L 250.0 317.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="22.0" y="397.0" width="216.0" height="46.0" rx="7" ry="7" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="130.0" y="415.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">完整天数费用 =</text>
  <text x="130.0" y="433.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">天数 × 400 MOP</text>
  <rect x="274.0" y="397.0" width="276.0" height="46.0" rx="7" ry="7" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="412.0" y="415.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">剩余部分费用 =</text>
  <text x="412.0" y="433.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">min(400, 向上取整小时数 × 20 MOP)</text>
  <path d="M 190.0 363.0 L 130.0 397.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 310.0 363.0 L 412.0 397.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="120.0" y="471.0" width="300.0" height="42.0" rx="7" ry="7" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="270.0" y="496.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">总费用 = 完整天数费用 + 剩余部分费用</text>
  <path d="M 130.0 443.0 L 200.0 471.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 412.0 443.0 L 340.0 471.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="492.0" y="471.0" width="240.0" height="42.0" rx="21.0" ry="21.0" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="612.0" y="496.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="600" fill="#14532d">输出时长与应收费用 (MOP)</text>
  <path d="M 420.0 492.0 L 492.0 492.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
