<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 476" style="width:100%; max-width:910px; height:auto; display:block; margin:8px auto; background:#ffffff; border:1px solid #cbd5e1; border-radius:8px;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="910" height="34" rx="8" ry="8" fill="#1e3a8a"/>
  <text x="455.0" y="22" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">圖 3：確定性停車時長與費用計算流程圖 (Deterministic Duration &amp; Fee Flowchart)</text>
  <rect x="225" y="46" width="460" height="42" rx="18" ry="18" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="455.0" y="60.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">查詢入口: ListWithFees(ref) 或 FindWithFee(plate, ref)</text>
<text x="455.0" y="77.0" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#0f172a">捕獲單一參考時間戳 reference，確保同次查詢基準一致</text>
<path d="M 455,88 L 455,110" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="195" y="110" width="520" height="46" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="455.0" y="126.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">調用 NormalizeToMinute(entry, start) 與 NormalizeToMinute(reference, end)</text>
<text x="455.0" y="143.0" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#0f172a">將入場時間與參考時間統一設 tm_sec = 0，對齊至本地整分鐘</text>
<path d="M 455,156 L 455,178" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<polygon points="455,178.0 630.0,212 455,246.0 280.0,212" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="455" y="213.6" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="bold" fill="#78350f">歸一化成功 且 difftime(end, start) &gt;= 0 ?</text>
<path d="M 630,212 L 685,212" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="648" y="202" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">否</text>
<rect x="685" y="184" width="205" height="56" rx="8" ry="8" fill="#fee2e2" stroke="#991b1b" stroke-width="1.8"/>
<text x="787.5" y="197.75" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">返回 false / kInvalidTime</text>
<text x="787.5" y="213.25" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="normal" fill="#0f172a">(負時長或溢出: 保持調用方</text>
<text x="787.5" y="228.75" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="normal" fill="#0f172a">輸出結構體與狀態不變)</text>
<path d="M 455,246 L 455,270" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="463" y="260" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">是</text>
<rect x="175" y="270" width="560" height="48" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="455.0" y="287.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">計算總停留分鐘數並按連續 24 小時 (1440 分鐘) 週期拆分:</text>
<text x="455.0" y="303.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="normal" fill="#0f172a">total_minutes = seconds / 60   |   days = total_minutes / 1440   |   remainder = total_minutes % 1440</text>
<path d="M 455,318 L 455,340" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="175" y="340" width="560" height="48" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="455.0" y="357.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">計算顯示時長與剩餘部分向上取整計費小時數:</text>
<text x="455.0" y="373.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="normal" fill="#0f172a">hours = remainder / 60,  minutes = remainder % 60   |   started_hours = (remainder + 59) / 60</text>
<path d="M 455,388 L 455,410" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="175" y="410" width="560" height="52" rx="8" ry="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="455.0" y="421.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">應用單週期 400 MOP 封頂並匯總整數澳門元費用:</text>
<text x="455.0" y="437.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="normal" fill="#0f172a">partial = min(400, started_hours * 20)   |   mop = days * 400 + partial</text>
<text x="455.0" y="453.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="normal" fill="#0f172a">輸出格式: Duration: X days Y hours Z minutes | Fee: N MOP</text>
</svg>