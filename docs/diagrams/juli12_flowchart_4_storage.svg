  <text x="260.0" y="192.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">校验目前记录并写入临时文件 (.tmp)</text>
  <path d="M 260.0 137.0 L 260.0 166.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="262.0" y="141.0" width="28.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="276.0" y="154.0" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="11.5" font-weight="600" fill="#334155">否</text>
