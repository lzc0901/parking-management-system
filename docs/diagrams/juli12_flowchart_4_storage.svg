  <text x="124.0" y="441.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">改名为备份文件 (.bak)</text>
  <rect x="292.0" y="404.0" width="196.0" height="48.0" rx="7" ry="7" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="390.0" y="423.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">确认无残留备份文件后</text>
  <text x="390.0" y="441.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">准备写入正式主文件</text>
  <path d="M 195.0 368.0 L 124.0 404.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="134.0" y="369.0" width="28.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="148.0" y="382.0" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="11.5" font-weight="600" fill="#334155">是</text>
  <path d="M 325.0 368.0 L 390.0 404.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="354.0" y="369.0" width="28.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="368.0" y="382.0" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="11.5" font-weight="600" fill="#334155">否</text>
  <rect x="135.0" y="481.0" width="250.0" height="42.0" rx="7" ry="7" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="260.0" y="506.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#0f172a">将临时文件改名为正式主文件</text>
  <path d="M 124.0 452.0 L 195.0 481.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 390.0 452.0 L 325.0 481.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polygon points="260.0,551.0 362.0,580.0 260.0,609.0 158.0,580.0" fill="#fef9c3" stroke="#b45309" stroke-width="1.7"/>
  <text x="260.0" y="584.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="600" fill="#78350f">替换主文件成功？</text>
  <path d="M 260.0 523.0 L 260.0 551.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="502.0" y="493.0" width="256.0" height="42.0" rx="21.0" ry="21.0" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="630.0" y="518.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="600" fill="#14532d">清理临时备份文件，回报保存成功</text>
  <path d="M 328.0 570.0 L 456.0 570.0 L 456.0 514.0 L 502.0 514.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="442.0" y="529.0" width="28.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="456.0" y="542.0" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="11.5" font-weight="600" fill="#334155">是</text>
  <rect x="482.0" y="557.0" width="296.0" height="46.0" rx="23.0" ry="23.0" fill="#ffedd5" stroke="#c2410c" stroke-width="1.8"/>
  <text x="630.0" y="575.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="600" fill="#7c2d12">尝试将备份文件改名复原为主文件</text>
  <text x="630.0" y="593.5" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="13" font-weight="500" fill="#7c2d12">依复原结果保留备份或锁定写入</text>
