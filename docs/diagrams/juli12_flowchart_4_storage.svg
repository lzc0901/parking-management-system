  <rect x="0" y="0" width="840" height="620" fill="#ffffff"/>
  <rect x="165.0" y="13.0" width="190.0" height="38.0" rx="19.0" ry="19.0" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.8"/>
