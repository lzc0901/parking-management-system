  <text x="276.0" y="308.0" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", sans-serif' font-size="11.5" font-weight="600" fill="#334155">是</text>
  <rect x="21.0" y="404.0" width="206.0" height="48.0" rx="7" ry="7" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
