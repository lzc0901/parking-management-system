<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 535" style="width:100%; max-width:910px; height:auto; display:block; margin:8px auto; background:#ffffff; border:1px solid #cbd5e1; border-radius:8px;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="910" height="34" rx="8" ry="8" fill="#1e3a8a"/>
  <text x="455.0" y="22" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">圖 4：本地文件載入、備份恢復與安全保存流程圖 (Load, Recovery &amp; Safe Save Flowchart)</text>
  <rect x="18" y="46" width="428" height="475" rx="8" ry="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5,4"/>
<text x="232" y="68" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="13.2" font-weight="bold" fill="#1e3a8a">A. 啟動載入與備份恢復 Storage::Load()</text>
<rect x="36" y="80" width="392" height="42" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="232.0" y="94.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">1. 預設 blocked_ = true，檢查 parking_data.txt 與 .bak</text>
<text x="232.0" y="110.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="normal" fill="#0f172a">若兩者均不存在 -&gt; 清空 service, blocked_=false (First run)</text>
<path d="M 232,122 L 232,144" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="36" y="144" width="392" height="48" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="232.0" y="161.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">2. 調用 ParseFile() 解析主文件 (若主文件缺失則解析 .bak)</text>
<text x="232.0" y="177.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="normal" fill="#0f172a">逐行檢查 4 列 Tab 分隔符、YYYY-MM-DD HH:MM 與車牌唯一性</text>
<path d="M 232,192 L 232,214" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<polygon points="232,215.0 347.0,244 232,273.0 117.0,244" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="232" y="245.75" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#78350f">全部行解析校驗通過?</text>
<path d="M 232,273 L 232,298" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="240" y="289" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">是</text>
<rect x="36" y="298" width="392" height="52" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="232.0" y="317.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">3. 若主文件缺失: rename(.bak -&gt; parking_data.txt)</text>
<text x="232.0" y="333.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="normal" fill="#0f172a">失敗則保留 .bak 並維持 blocked_=true; 成功則輸出 Recovered</text>
<path d="M 232,350 L 232,374" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="36" y="374" width="392" height="42" rx="8" ry="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="232.0" y="388.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">4. 全量提交記錄至 service，設 blocked_ = false</text>
<text x="232.0" y="404.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="normal" fill="#0f172a">返回 Loaded parking_data.txt. (或 Recovered ...)</text>
<rect x="36" y="434" width="392" height="72" rx="8" ry="8" fill="#fee2e2" stroke="#991b1b" stroke-width="1.8"/>
<text x="232.0" y="455.65" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="bold" fill="#0f172a">若任一行損壞或重複 (All-or-Nothing 失敗保護):</text>
<text x="232.0" y="471.34999999999997" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="normal" fill="#0f172a">• 返回精確行號: Line N: expected four tab-separated fields. 等</text>
<text x="232.0" y="487.04999999999995" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="normal" fill="#0f172a">• 原 service 保持不變，維持 blocked_ = true 阻止後續覆蓋</text>
<path d="M 117,244 L 26,244 L 26,468 L 36,468" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60" y="236" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">否</text>
<rect x="464" y="46" width="428" height="475" rx="8" ry="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5,4"/>
<text x="678" y="68" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="13.2" font-weight="bold" fill="#1e3a8a">B. 多步驟安全保存與失敗回滾協議 Storage::Save()</text>
<rect x="482" y="80" width="392" height="42" rx="8" ry="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
<text x="678.0" y="94.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="bold" fill="#0f172a">1. 檢查 blocked_ 標誌: 若 blocked_ == true 立即拒絕保存</text>
<text x="678.0" y="110.2" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.2" font-weight="normal" fill="#0f172a">(Save blocked: resolve the load or recovery error and reload first.)</text>
<path d="M 678,122 L 678,144" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="482" y="144" width="392" height="48" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="678.0" y="161.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">2. 校驗內存快照並寫入臨時文件 parking_data.txt.tmp</text>
<text x="678.0" y="177.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="normal" fill="#0f172a">寫入 # PARKING_SYSTEM_V1 與車牌升序 TSV 行，檢查 flush/close</text>
<path d="M 678,192 L 678,214" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="482" y="214" width="392" height="54" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="678.0" y="226.75" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.0" font-weight="bold" fill="#0f172a">3. 替換前保護現有數據 (多步驟協議):</text>
<text x="678.0" y="242.25" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.0" font-weight="normal" fill="#0f172a">• 主文件存在: ParseFile() 確認未損壞，刪舊 .bak 後 rename 為 .bak</text>
<text x="678.0" y="257.75" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.0" font-weight="normal" fill="#0f172a">• 主文件不存在但有意外 .bak: 設 blocked_=true 並中止</text>
<path d="M 678,268 L 678,290" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="482" y="290" width="392" height="40" rx="8" ry="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="678.0" y="311.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">4. 執行重命名替換: rename(.tmp -&gt; parking_data.txt)</text>
<path d="M 678,330 L 678,352" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<polygon points="678,353.0 783.0,380 678,407.0 573.0,380" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="678" y="381.75" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#78350f">替換主文件成功?</text>
<path d="M 678,407 L 678,434" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="686" y="423" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">是</text>
<rect x="482" y="434" width="212" height="72" rx="8" ry="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="588.0" y="455.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">5a. 替換成功:</text>
<text x="588.0" y="471.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="normal" fill="#0f172a">刪除臨時 .bak 備份</text>
<text x="588.0" y="487.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="normal" fill="#0f172a">返回 Parking data saved.</text>
<path d="M 783,380 L 804,380 L 804,434" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="790" y="372" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">否</text>
<rect x="704" y="434" width="170" height="72" rx="8" ry="8" fill="#fee2e2" stroke="#991b1b" stroke-width="1.8"/>
<text x="789.0" y="448.2" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="10.8" font-weight="bold" fill="#0f172a">5b. 替換失敗回滾:</text>
<text x="789.0" y="463.5" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="10.8" font-weight="normal" fill="#0f172a">將 .bak 恢復為主文件;</text>
<text x="789.0" y="478.8" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="10.8" font-weight="normal" fill="#0f172a">若回滾也失敗則保留</text>
<text x="789.0" y="494.1" text-anchor="middle" font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-size="10.8" font-weight="normal" fill="#0f172a">.bak 並設 blocked_=true</text>
</svg>